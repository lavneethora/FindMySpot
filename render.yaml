# Render blueprint for the pipeline. The frontend is on Vercel and is not
# described here.
#
# Free plan notes, both of which matter for a demo:
#   - the service sleeps after 15 minutes with no traffic, and the next request
#     waits about 50 seconds for a cold start. Open it before anyone looks.
#   - 512 MB of RAM. Measured usage is about 70 MB steady, because the
#     expensive work happened when the detection cache was built.

services:
  - type: web
    name: findmyspot-pipeline
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./deploy/Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/state
    envVars:
      # Set in the dashboard, not here. This file is public.
      - key: DATABASE_URL
        sync: false
      # Both origins on purpose. findmyspot.tech is the one we demo, and the
      # vercel.app address stays allowed so a DNS or certificate problem on the
      # custom domain does not also take out the fallback URL.
      - key: ALLOWED_ORIGINS
        value: https://findmyspot.tech,https://findmyspot-three.vercel.app
